<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PowerD</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="topbar" id="topbar">
      <div class="brand">
        <span class="title">PowerD</span>
        <span class="version" id="version"></span>
      </div>
      <nav class="tabs">
        <button class="tab active" data-tab="app">App</button>
        <button class="tab" data-tab="cli">CLI</button>
      </nav>
      <div class="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">启动中…</span>
      </div>
      <button class="bar-close" id="bar-close" title="隐藏工具栏">×</button>
    </header>

    <div class="grabber" id="grabber" title="显示工具栏"></div>

    <main>
      <section class="panel active" id="panel-app">
        <div class="app-frame">
          <div class="loading" id="loading">
            <!-- fixed brand block: logo, name, version (shown throughout) -->
            <div class="launch-frame" id="launch-frame">
              <img class="app-icon" src="/powerd-icon.svg" alt="PowerD" />
              <div class="brand-name">PowerD</div>
              <span class="brand-ver" id="brand-ver"></span>
            </div>
            <!-- loading spinner: still-frame phase only; the wizard card
                 takes over once the launch exceeds the fast path -->
            <div class="spinner" id="loading-spinner"></div>

            <!-- wizard card, revealed after ~250ms on the slow path -->
            <div class="guide hidden" id="guide">
              <div class="a-card">
                <div class="a-head">
                  <h2 class="a-title" id="guide-title">正在准备 PowerD</h2>
                  <a class="a-link" id="btn-detail" title="查看检测明细与日志">详情 ▸</a>
                </div>
                <p class="a-sub" id="guide-sub"></p>
                <div class="a-steps">
                  <div class="a-step" data-step="0">
                    <span class="dot" id="step-dot-0"></span>
                    <span class="label">检测环境</span>
                    <span class="a-connector" data-conn="0"></span>
                  </div>
                  <div class="a-step" data-step="1">
                    <span class="dot" id="step-dot-1"></span>
                    <span class="label">准备 dsh</span>
                    <span class="a-connector" data-conn="1"></span>
                  </div>
                  <div class="a-step" data-step="2">
                    <span class="dot" id="step-dot-2"></span>
                    <span class="label">启动服务</span>
                  </div>
                </div>
                <p class="a-detail" id="guide-detail"></p>
                <div class="a-error hidden" id="guide-error">
                  <div class="head"><span>⚠</span> <span id="err-title"></span></div>
                  <p class="why" id="err-why"></p>
                  <p class="fix" id="err-fix"></p>
                  <div class="actions">
                    <button class="btn primary" id="btn-retry"></button>
                    <button class="btn ghost" id="btn-copy-error">复制命令</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- detail modal: env checks + live log + fix guidance -->
            <div class="overlay hidden" id="detail-overlay">
              <div class="modal">
                <div class="modal-head">
                  <h3>环境详情</h3>
                  <button class="x" id="btn-detail-close" title="关闭">×</button>
                </div>
                <div class="b-checks" id="detail-checks"></div>
                <div class="b-panel">
                  <h4>日志</h4>
                  <pre class="b-log" id="detail-log"></pre>
                  <p class="b-fix hidden" id="detail-fix"></p>
                </div>
              </div>
            </div>
          </div>
          <iframe id="app-iframe" src="about:blank" title="PowerD"></iframe>
        </div>
      </section>

      <section class="panel" id="panel-cli">
        <div class="cli-toolbar">
          <button id="btn-start">启动</button>
          <button id="btn-stop">停止</button>
          <button id="btn-restart">重启</button>
          <button id="btn-upgrade" title="升级应用内置的 dsh">升级</button>
          <span class="spacer"></span>
          <button id="btn-clear">清空</button>
          <button id="btn-copy">复制</button>
        </div>
        <pre class="log" id="log"></pre>
      </section>
    </main>
  </body>
</html>
